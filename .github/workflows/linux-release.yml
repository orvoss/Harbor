name: Linux AppImage Release

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to triggering ref)
        type: string
        default: ""
      tag:
        description: Release tag override (defaults to v<version> from tauri.conf.json)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag override (defaults to v<version> from tauri.conf.json)
        type: string
        default: ""
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-and-publish:
    name: Arch Linux x86_64 Native AppImage
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 120

    steps:
      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib \
            base-devel \
            curl \
            desktop-file-utils \
            file \
            git \
            github-cli \
            gst-libav \
            gst-plugins-bad \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-ugly \
            gstreamer \
            gtk3 \
            icu \
            jdk17-openjdk \
            libayatana-appindicator \
            libpulse \
            librsvg \
            mpv \
            openssl \
            patchelf \
            pkgconf \
            squashfs-tools \
            systemd-libs \
            unzip \
            webkit2gtk-4.1 \
            wget \
            which \
            xz
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"
          workspaces: |
            harbor-core
            src-tauri
            src-tauri/extensions-module

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Pokémon engine SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Build Pokémon engine
        run: |
          node tools/pokemon-engine/build.mjs \
            --fetch-source "${{ runner.temp }}/harbor-pokemon-source" \
            --output src-tauri/resources/pokemon-engine \
            --artifacts "${{ runner.temp }}/harbor-pokemon-build"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch fonts
        run: pnpm run setup:fonts

      - name: Build native Arch Harbor binary
        run: |
          pnpm tauri build \
            --no-bundle \
            --target x86_64-unknown-linux-gnu \
            --config '{"bundle":{"externalBin":[],"createUpdaterArtifacts":true}}'

      - name: Package thin Arch-native AppImage and sign
        id: manifest
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required for in-app updates."
            exit 1
          fi

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          BIN="src-tauri/target/x86_64-unknown-linux-gnu/release/harbor"
          test -x "$BIN"

          STAGE_DIR="${RUNNER_TEMP}/harbor-linux-release"
          APPDIR="${RUNNER_TEMP}/Harbor.AppDir"
          rm -rf "$STAGE_DIR" "$APPDIR"
          mkdir -p "$STAGE_DIR" "$APPDIR/usr/bin" "$APPDIR/usr/lib/Harbor/fonts" "$APPDIR/usr/lib/Harbor/notices" "$APPDIR/usr/lib/Harbor/resources"

          # Binary + Tauri resource_dir layout ($APPDIR/usr/lib/Harbor)
          install -Dm755 "$BIN" "$APPDIR/usr/bin/harbor"
          ln -s Harbor "$APPDIR/usr/lib/harbor"
          cp -a src-tauri/fonts/. "$APPDIR/usr/lib/Harbor/fonts/"
          cp -a src-tauri/THIRD-PARTY-NOTICES.txt "$APPDIR/usr/lib/Harbor/notices/"
          for dir in harbor-stream-blocker capstan pokemon-engine moonshine; do
            if [ -d "src-tauri/resources/${dir}" ]; then
              cp -a "src-tauri/resources/${dir}" "$APPDIR/usr/lib/Harbor/resources/${dir}"
            fi
          done

          # AppImage metadata and clean AppRun (uses host Arch webkit2gtk-4.1, mpv, Mesa, Wayland, libva)
          cp src-tauri/icons/128x128.png "$APPDIR/harbor.png"
          ln -s harbor.png "$APPDIR/.DirIcon"
          cat <<'EOF' > "$APPDIR/harbor.desktop"
          [Desktop Entry]
          Name=Harbor
          Comment=Stremio-compatible media client
          Exec=harbor %U
          Icon=harbor
          Type=Application
          Categories=AudioVideo;Video;Player;
          MimeType=x-scheme-handler/harbor;x-scheme-handler/stremio;
          StartupWMClass=harbor
          EOF

          cat <<'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="${APPDIR:-$HERE}"
          exec "$HERE/usr/bin/harbor" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          APPIMAGE_NAME="Harbor_${VERSION}_amd64.AppImage"
          APPIMAGE="${STAGE_DIR}/${APPIMAGE_NAME}"
          curl -fsSL --retry 4 --retry-delay 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o "${RUNNER_TEMP}/appimagetool"
          chmod +x "${RUNNER_TEMP}/appimagetool"
          ARCH=x86_64 "${RUNNER_TEMP}/appimagetool" "$APPDIR" "$APPIMAGE"
          test -s "$APPIMAGE"

          pnpm tauri signer sign "$APPIMAGE" --password=
          SIG_FILE="${APPIMAGE}.sig"
          test -s "$SIG_FILE"

          VERSION="$VERSION" \
          TAG="$TAG" \
          REPO="$REPO" \
          APPIMAGE_NAME="$APPIMAGE_NAME" \
          SIG_FILE="$SIG_FILE" \
          STAGE_DIR="$STAGE_DIR" \
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const repo = process.env.REPO;
            const appimageName = process.env.APPIMAGE_NAME;
            const sig = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const manifest = {
              version,
              notes: `Harbor ${version} for Arch Linux (native x86_64 thin AppImage)`,
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": {
                  signature: sig,
                  url: `https://github.com/${repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(appimageName)}`,
                },
              },
            };
            fs.writeFileSync(`${process.env.STAGE_DIR}/latest.json`, JSON.stringify(manifest, null, 2) + "\n");
          '

          ls -lh "$STAGE_DIR"
          cat "${STAGE_DIR}/latest.json"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stage_dir=${STAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "appimage_name=${APPIMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-arch-x86_64-${{ steps.manifest.outputs.version }}
          path: ${{ steps.manifest.outputs.stage_dir }}/*
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
          STAGE_DIR: ${{ steps.manifest.outputs.stage_dir }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${STAGE_DIR}"/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$TAG" "${STAGE_DIR}"/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harbor v${VERSION} (Arch Linux)" \
              --notes "Native Arch Linux x86_64 AppImage build from HarborCommunity/Harbor (uses host webkit2gtk-4.1, mpv, Mesa, Wayland, and VA-API) with signed in-app auto-updates." \
              --latest
          fi
